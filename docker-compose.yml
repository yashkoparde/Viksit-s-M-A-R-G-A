services:
  marga-platform:
    build:
      context: .
      dockerfile: Dockerfile
    image: marga-platform:v1.0.0
    container_name: marga_statutory_portal
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI:-mongodb://localhost:27017/mplads_db}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
