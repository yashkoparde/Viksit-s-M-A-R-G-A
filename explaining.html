  <style>
    :root {
      --font-title: 'Space Grotesk', sans-serif;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'Fira Code', monospace;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: var(--font-body);
      background-color: #060913;
      color: #f1f5f9;
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }
    .font-title { font-family: var(--font-title); }
    .font-mono { font-family: var(--font-mono); }

    /* Clean Architectural Main Box */
    .arch-node {
      position: absolute;
      transform: translate(-50%, -50%);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
      z-index: 10;
    }
    .arch-card {
      width: 175px;
      height: 92px;
      background: #0d121f;
      border: 1.5px solid #1e293b;
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    .arch-node:hover .arch-card {
      border-color: #38bdf8;
      background: #111827;
      transform: translateY(-2px);
    }
    .arch-node.active-node {
      z-index: 25;
      transform: translate(-50%, -50%) scale(1.06);
    }
    .arch-node.active-node .arch-card {
      border-color: #38bdf8;
      background: #131c2e;
      box-shadow: 0 0 0 1px #38bdf8, 0 10px 30px rgba(0, 0, 0, 0.8);
    }
    .arch-node.inactive-node {
      opacity: 0.38;
      transform: translate(-50%, -50%) scale(0.96);
    }

    /* Sub-Workflow Child Box (Clean: Tag + Title + Clean Neutral Spec, No Blue Bullets) */
    .sub-arch-node {
      position: absolute;
      transform: translate(-50%, -50%);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
      z-index: 20;
    }
    .sub-arch-card {
      width: 210px;
      min-height: 110px;
      background: #0d121f;
      border: 1.5px solid #1e293b;
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.6);
    }
    .sub-arch-node:hover .sub-arch-card {
      border-color: #38bdf8;
      background: #111827;
    }
    .sub-arch-node.active-sub {
      z-index: 30;
      transform: translate(-50%, -50%) scale(1.06);
    }
    .sub-arch-node.active-sub .sub-arch-card {
      border-color: #38bdf8;
      background: #131c2e;
      box-shadow: 0 0 0 1px #38bdf8, 0 12px 35px rgba(0, 0, 0, 0.85);
    }
    .sub-arch-node.inactive-sub {
      opacity: 0.36;
      transform: translate(-50%, -50%) scale(0.96);
    }

    /* Circuit Bus Vector Rails */
    .wire-active {
      stroke-dasharray: 6 6;
      animation: wire-flow 1.4s linear infinite;
    }
    @keyframes wire-flow {
      from { stroke-dashoffset: 24; }
      to { stroke-dashoffset: 0; }
    }
  </style>

    let activeNode = 0;
    let activeSubNode = 0;
    let isSubBlobOpen = false;

    function layoutUniverse() {
      const w = window.innerWidth;
      const h = window.innerHeight - 110;

      UNIVERSE_POSITIONS.forEach((pos, idx) => {
        const el = document.getElementById('node-' + idx);
        const actualX = (pos.x / 100) * w;
        const actualY = (pos.y / 100) * h + 55;
        el.style.left = actualX + 'px';
        el.style.top = actualY + 'px';
      });

      for (let i = 0; i < 6; i++) {
        const p1 = UNIVERSE_POSITIONS[i];
        const p2 = UNIVERSE_POSITIONS[i + 1];
        const x1 = (p1.x / 100) * w;
        const y1 = (p1.y / 100) * h + 55;
        const x2 = (p2.x / 100) * w;
        const y2 = (p2.y / 100) * h + 55;

        const cx1 = x1 + (x2 - x1) * 0.5;
        const cy1 = y1;
        const cx2 = x1 + (x2 - x1) * 0.5;
        const cy2 = y2;

        const d = `M ${x1} ${y1} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${x2} ${y2}`;
        document.getElementById('rail-' + i).setAttribute('d', d);
      }
    }

    function layoutSubUniverse() {
      const w = window.innerWidth;
      const h = window.innerHeight - 130;

      SUB_POSITIONS.forEach((pos, idx) => {
        const el = document.getElementById('sub-node-' + idx);
        const actualX = (pos.x / 100) * w;
        const actualY = (pos.y / 100) * h + 65;
        el.style.left = actualX + 'px';
        el.style.top = actualY + 'px';
      });

      for (let i = 0; i < 3; i++) {
        const p1 = SUB_POSITIONS[i];
        const p2 = SUB_POSITIONS[i + 1];
        const x1 = (p1.x / 100) * w;
        const y1 = (p1.y / 100) * h + 65;
        const x2 = (p2.x / 100) * w;
        const y2 = (p2.y / 100) * h + 65;

        const cx1 = x1 + (x2 - x1) * 0.5;
        const cy1 = y1;
        const cx2 = x1 + (x2 - x1) * 0.5;
        const cy2 = y2;

        const d = `M ${x1} ${y1} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${x2} ${y2}`;
        document.getElementById('sub-rail-' + i).setAttribute('d', d);
      }
    }

    function updateUniverseState() {
      const w = window.innerWidth;
      const h = window.innerHeight - 110;

      for (let i = 0; i < 7; i++) {
        const nodeEl = document.getElementById('node-' + i);
        const pillEl = document.getElementById('pill-' + i);
        if (i === activeNode) {
          nodeEl.className = 'arch-node active-node';
          pillEl.className = 'px-2.5 py-1 text-[11px] font-mono rounded border border-sky-500 bg-sky-950/50 text-slate-100 font-semibold transition';
        } else {
          nodeEl.className = 'arch-node inactive-node';
          pillEl.className = 'px-2.5 py-1 text-[11px] font-mono rounded border border-transparent text-slate-400 hover:text-slate-200 transition';
        }
      }

      for (let i = 0; i < 6; i++) {
        const rail = document.getElementById('rail-' + i);
        if (i < activeNode) {
          rail.setAttribute('stroke', '#38bdf8');
          rail.setAttribute('stroke-width', '3');
          rail.classList.add('wire-active');
        } else {
          rail.setAttribute('stroke', '#1e293b');
          rail.setAttribute('stroke-width', '2.5');
          rail.classList.remove('wire-active');
        }
      }

      const targetPos = UNIVERSE_POSITIONS[activeNode];
      const targetX = (targetPos.x / 100) * w;
      const targetY = (targetPos.y / 100) * h + 55;

      const photon = document.getElementById('photonParticle');
      photon.setAttribute('cx', targetX);
      photon.setAttribute('cy', targetY);

      document.getElementById('stepCounter').innerText = activeNode + 1;
      document.getElementById('universeCue').innerText = `"${UNIVERSE_DATA[activeNode].cue}"`;
    }

    function updateSubUniverseState() {
      const w = window.innerWidth;
      const h = window.innerHeight - 130;
      const data = UNIVERSE_DATA[activeNode];

      document.getElementById('subModuleBadge').innerText = data.badge;
      document.getElementById('subStepNumber').innerText = activeSubNode + 1;

      for (let i = 0; i < 4; i++) {
        const sub = data.subBlobs[i];
        const subNode = document.getElementById('sub-node-' + i);
        
        if (i === activeSubNode) {
          subNode.className = 'sub-arch-node active-sub';
        } else {
          subNode.className = 'sub-arch-node inactive-sub';
        }

        document.getElementById('sub-tag-' + i).innerText = sub.tag;
        document.getElementById('sub-icon-' + i).innerHTML = `<i data-lucide="${sub.icon}" class="w-4 h-4 text-slate-300"></i>`;
        document.getElementById('sub-title-' + i).innerText = sub.title;
        document.getElementById('sub-metric-' + i).innerText = sub.metric;
      }

      lucide.createIcons();

      for (let i = 0; i < 3; i++) {
        const rail = document.getElementById('sub-rail-' + i);
        if (i < activeSubNode) {
          rail.setAttribute('stroke', '#38bdf8');
          rail.setAttribute('stroke-width', '3');
          rail.classList.add('wire-active');
        } else {
          rail.setAttribute('stroke', '#1e293b');
          rail.setAttribute('stroke-width', '2.5');
          rail.classList.remove('wire-active');
        }
      }

      const currentSub = data.subBlobs[activeSubNode];
      const targetPos = SUB_POSITIONS[activeSubNode];
      const targetX = (targetPos.x / 100) * w;
      const targetY = (targetPos.y / 100) * h + 65;

      const subPhoton = document.getElementById('subPhotonParticle');
      subPhoton.setAttribute('cx', targetX);
      subPhoton.setAttribute('cy', targetY);

      document.getElementById('subUniverseCue').innerText = `"${currentSub.cue}"`;
    }

    function openSubBlobs(idx) {
      activeNode = idx;
      activeSubNode = 0;
      updateUniverseState();
      isSubBlobOpen = true;

      const overlay = document.getElementById('subBlobOverlay');
      overlay.classList.remove('opacity-0', 'pointer-events-none');
      overlay.classList.add('opacity-100');

      layoutSubUniverse();
      updateSubUniverseState();
    }

    function closeSubBlobs() {
      const overlay = document.getElementById('subBlobOverlay');
      overlay.classList.remove('opacity-100');
      overlay.classList.add('opacity-0', 'pointer-events-none');
      isSubBlobOpen = false;
      updateUniverseState();
    }

    function handleNodeClick(idx) {
      openSubBlobs(idx);
    }

    function setNode(idx) {
      activeNode = idx;
      updateUniverseState();
      if (isSubBlobOpen) {
        openSubBlobs(idx);
      }
    }

    function setSubNode(idx) {
      activeSubNode = idx;
      updateSubUniverseState();
    }

    function nextSubNode() {
      activeSubNode = (activeSubNode + 1) % 4;
      updateSubUniverseState();
    }

    function prevSubNode() {
      activeSubNode = (activeSubNode - 1 + 4) % 4;
      updateSubUniverseState();
    }

    function nextStep() {
      if (isSubBlobOpen) {
        if (activeSubNode < 3) {
          nextSubNode();
        } else {
          activeNode = (activeNode + 1) % 7;
          openSubBlobs(activeNode);
        }
      } else {
        activeNode = (activeNode + 1) % 7;
        updateUniverseState();
      }
    }

    function prevStep() {
      if (isSubBlobOpen) {
        if (activeSubNode > 0) {
          prevSubNode();
        } else {
          activeNode = (activeNode - 1 + 7) % 7;
          openSubBlobs(activeNode);
          activeSubNode = 3;
          updateSubUniverseState();
        }
      } else {
        activeNode = (activeNode - 1 + 7) % 7;
        updateUniverseState();
      }
    }

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeSubBlobs();
      } else if (e.code === 'Space' || e.key === 'ArrowRight') {
        e.preventDefault();
        nextStep();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevStep();
      } else if (e.key === 'Enter') {
        if (!isSubBlobOpen) openSubBlobs(activeNode);
      }
    });

    window.addEventListener('resize', () => {
      layoutUniverse();
      updateUniverseState();
      if (isSubBlobOpen) {
        layoutSubUniverse();
        updateSubUniverseState();
      }
    });

    layoutUniverse();
    updateUniverseState();
  </script>
